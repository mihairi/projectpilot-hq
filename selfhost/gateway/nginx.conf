# Single entry point that mimics the hosted API surface the app expects:
#   http://<host>:8000/auth/v1/...   -> GoTrue (sign-in, 2FA, admin user management)
#   http://<host>:8000/rest/v1/...   -> PostgREST (all table reads and writes, RLS enforced)
server {
  listen 80;
  client_max_body_size 20m;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Profile public;
    proxy_set_header Content-Profile public;
  }

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
}
